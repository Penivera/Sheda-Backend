[project]
name = "backend"
version = "0.1.0"
description = "Backend for Sheda Solutions"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "annotated-types>=0.8.0",
    "anyio>=4.15.1",
    "asgiref>=3.12.1",
    "async-timeout>=5.0.1",
    "base58>=2.1.1",
    "bcrypt>=5.0.0",
    "certifi>=2026.7.22",
    "charset-normalizer>=3.5.1",
    "click>=8.5.0",
    "cloudinary>=1.46.2",
    "cryptography>=47.0.0",
    "deprecated>=1.3.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-auth>=2.58.0",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.20",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "limits>=5.8.0",
    "markupsafe>=3.0.3",
    "packaging>=26.3",
    "passlib>=1.7.4",
    "pg8000>=1.31.5",
    "pyasn1>=0.6.4",
    "pyasn1-modules>=0.4.2",
    "pycparser>=3.0",
    "pydantic>=2.13.5",
    "pydantic-extra-types>=2.11.1",
    "pydantic-partial>=0.11.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "python-engineio>=4.14.0",
    "python-multipart>=0.0.32",
    "python-socketio>=5.17.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "simple-websocket>=1.1.0",
    "six>=1.17.0",
    "slowapi>=0.1.10",
    "sniffio>=1.3.1",
    "sqlalchemy>=2.0.54",
    "starlette>=1.7.0",
    "starlette-admin<1.0.0",
    "structlog>=26.1.0",
    "typing-extensions>=4.16.0",
    "typing-inspection>=0.4.4",
    "urllib3>=2.8.0",
    "websockets>=17.1",
    "wrapt>=2.4.1",
    "wsproto>=1.3.2",
    "wtforms>=3.2.2",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "uvicorn>=0.53.0",
    "workers-py",
    "workers-runtime-sdk",
    "coverage>=7.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "locust>=2.46.6",
    "gevent>=26.9.0",
    "geventhttpclient>=2.3.9",
]
